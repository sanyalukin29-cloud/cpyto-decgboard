<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pordee Engine · System Health</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    background:#070b0f;color:#e2e8f0;padding:16px;min-height:100vh}
  .wrap{max-width:760px;margin:0 auto}
  .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .brand{font-size:12px;letter-spacing:.18em;color:#5eead4;text-transform:uppercase}
  .sub{font-size:20px;font-weight:700;margin-bottom:14px;color:#f1f5f9}
  .banner{font-size:14px;font-weight:700;padding:10px 16px;border-radius:12px;text-align:center;margin-bottom:16px}
  .sec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:18px 0 9px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:9px}
  .card{padding:11px 12px;border-radius:11px;border:1px solid #1e293b}
  .crow{display:flex;align-items:center;gap:7px}
  .dot{font-size:11px}
  .lbl{font-size:12.5px;font-weight:600;color:#e2e8f0}
  .meta{font-size:11px;color:#94a3b8;margin-top:5px}
  .blk{display:flex;justify-content:space-between;gap:10px;align-items:center;
    padding:9px 12px;border:1px solid #3f1d1d;border-radius:9px;background:#160d0d;margin-bottom:6px}
  .bsym{color:#fca5a5;font-weight:700;font-size:13px}
  .brsn{color:#cbd5e1;font-size:11.5px;text-align:right}
  .foot{margin-top:18px;display:flex;align-items:center;justify-content:space-between;
    font-size:11px;color:#475569}
  .btn{background:#0e2a2a;color:#5eead4;border:1px solid #155e5e;border-radius:8px;
    padding:6px 14px;font-size:12px;cursor:pointer}
  .empty{color:#475569;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="brand">Pordee Engine · Mission Control</div>
    <button class="btn" onclick="load()">รีเฟรช</button>
  </div>
  <div class="sub">สุขภาพระบบ · System Health</div>
  <div id="banner" class="banner" style="background:#1e293b">กำลังโหลด…</div>

  <div class="sec" style="color:#5eead4">⚙️ ตัวจับสัญญาณ &amp; เครื่องยนต์</div>
  <div id="grid" class="grid"></div>

  <div class="sec" style="color:#f87171">🛡️ Honeypot Guard · บล็อกล่าสุด</div>
  <div id="blocks"></div>

  <div class="foot">
    <span id="updated">—</span>
    <span>auto-refresh 30s</span>
  </div>
</div>

<script>
  const U="https://fkhykyfgykguvpelmdsf.supabase.co";
  const K="sb_publishable_D9QFmKMzoyzvCRrsqHoeDg_9JpKjKJA";
  const H={apikey:K,Authorization:"Bearer "+K};
  const C={ok:"#10b981",warn:"#f59e0b",down:"#ef4444"};
  const IC={ok:"●",warn:"▲",down:"■"};

  async function q(path){
    try{const r=await fetch(U+"/rest/v1/"+path,{headers:H});return r.ok?await r.json():null;}
    catch(e){return null;}
  }

  async function load(){
    const [h,b]=await Promise.all([
      q("engine_health?select=*"),
      q("guard_recent?select=*")
    ]);
    const banner=document.getElementById('banner');

    if(h===null){
      banner.textContent="⚠ เชื่อมต่อฐานข้อมูลไม่ได้";
      banner.style.background="#7f1d1d";banner.style.color="#fecaca";
      return;
    }

    const down=h.filter(x=>x.state==='down').length;
    const warn=h.filter(x=>x.state==='warn').length;
    if(down){banner.textContent="⚠ มีปัญหา "+down+" จุด — ต้องแก้ด่วน";
      banner.style.background="#7f1d1d";banner.style.color="#fecaca";}
    else if(warn){banner.textContent="⚠ เฝ้าระวัง "+warn+" จุด";
      banner.style.background="#78350f";banner.style.color="#fde68a";}
    else{banner.textContent="✓ ทุกระบบทำงานปกติ";
      banner.style.background="#064e3b";banner.style.color="#a7f3d0";}

    document.getElementById('grid').innerHTML=h.map(x=>{
      const c=C[x.state]||"#64748b";
      return `<div class="card" style="border-color:${c}33;background:${c}0d">
        <div class="crow"><span class="dot" style="color:${c}">${IC[x.state]||'●'}</span>
        <span class="lbl">${x.label}</span></div>
        <div class="meta">${x.min_ago} นาทีก่อน · ${x.last_seen}</div></div>`;
    }).join("");

    const eb=document.getElementById('blocks');
    if(!b||!b.length){eb.innerHTML='<div class="empty">— ยังไม่มีเหรียญถูกบล็อก —</div>';}
    else eb.innerHTML=b.map(x=>`<div class="blk">
        <span class="bsym">${x.symbol}</span>
        <span class="brsn">${x.reason}${x.rug_score?(' · score '+x.rug_score):''}<br>${x.rug_risks||''}</span>
      </div>`).join("");

    const now=new Date();
    document.getElementById('updated').textContent=
      "อัปเดต "+now.toLocaleTimeString('th-TH');
  }

  load();
  setInterval(load,30000);
</script>
</body>
</html>
